name: Validate Profile

on:
  push:
    branches:
      - main
      - "design/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: README and SVG integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate profile assets
        run: python scripts/validate_profile.py
