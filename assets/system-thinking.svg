<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" role="img" aria-labelledby="title desc">
<title id="title">An integrated infrastructure engineering lifecycle</title>
<desc id="desc">Requirements lead to low-level design, integration, validation and operations. Compute and virtualization, network connectivity, storage and protection, and security and resilience are connected in the design.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101319"/><stop offset="1" stop-color="#17191E"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#A98D66"/><stop offset=".5" stop-color="#E6CFA3"/><stop offset="1" stop-color="#B69B75"/></linearGradient>
<style>
.key{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2.3px;fill:#AFAA9F}
.title{font:600 21px 'Segoe UI',Arial,sans-serif;fill:#EEE9E1}
.flow{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#F2EDE5}
.layer{font:550 18px 'Segoe UI',Arial,sans-serif;fill:#DDDBD5}
.idx{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;fill:#D4B989}
.note{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#AFABA5}
</style>
</defs>
<rect width="1200" height="366" rx="14" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="364" rx="13" fill="none" stroke="#AD9D82" stroke-opacity=".33"/>
<path d="M28 59H1172M28 328H1172" stroke="#B9B09E" stroke-opacity=".24"/>
<text x="29" y="37" class="key">ARCHITECTURE IS A SERIES OF CONNECTED DECISIONS</text>
<text x="1170" y="37" text-anchor="end" class="key">DESIGN / DELIVERY / OPERATIONS</text>
<g>
<rect x="29" y="85" width="197" height="66" rx="7" fill="#1D2228" stroke="#BBA783" stroke-opacity=".47"/>
<rect x="261" y="85" width="197" height="66" rx="7" fill="#1D2228" stroke="#BBA783" stroke-opacity=".47"/>
<rect x="493" y="85" width="197" height="66" rx="7" fill="#1D2228" stroke="#BBA783" stroke-opacity=".47"/>
<rect x="725" y="85" width="197" height="66" rx="7" fill="#1D2228" stroke="#BBA783" stroke-opacity=".47"/>
<rect x="957" y="85" width="214" height="66" rx="7" fill="#1D2228" stroke="#BBA783" stroke-opacity=".47"/>
<path d="M228 117H258M460 117H490M692 117H722M924 117H954" stroke="url(#gold)" stroke-width="2"/>
