<text x="46" y="109" class="idx">01</text><text x="46" y="135" class="flow">Requirements</text>
<text x="278" y="109" class="idx">02</text><text x="278" y="135" class="flow">Low-level design</text>
<text x="510" y="109" class="idx">03</text><text x="510" y="135" class="flow">Integration</text>
<text x="742" y="109" class="idx">04</text><text x="742" y="135" class="flow">Validation</text>
<text x="974" y="109" class="idx">05</text><text x="974" y="135" class="flow">Operations</text>
</g>
<path d="M600 151V191M156 191H1044M156 191V208M452 191V208M748 191V208M1044 191V208" stroke="#C7B28D" stroke-opacity=".52" fill="none" stroke-width="1.5"/>
