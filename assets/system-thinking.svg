<rect x="29" y="208" width="268" height="82" rx="8" fill="#141B22" stroke="#848D91" stroke-opacity=".4"/>
<rect x="322" y="208" width="268" height="82" rx="8" fill="#141B22" stroke="#848D91" stroke-opacity=".4"/>
