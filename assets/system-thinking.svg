<text x="44" y="258" class="layer">Compute &amp; virtualization</text>
<text x="337" y="258" class="layer">Network &amp; connectivity</text>
<text x="630" y="258" class="layer">Storage &amp; protection</text>
<text x="923" y="258" class="layer">Security &amp; resilience</text>
</g>
<text x="29" y="344" class="note">Constraints, dependencies, failure domains and tradeoffs connect every layer.</text>
<text x="1170" y="344" text-anchor="end" class="note">Systems thinking in practice</text>
