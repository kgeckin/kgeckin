<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-labelledby="title desc">
<title id="title">Engineering profile at a glance</title>
<desc id="desc">Four areas: Enterprise Storage, Physics Engineering, Linux and Automation, Security and AI.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10141A"/><stop offset="1" stop-color="#17181E"/></linearGradient>
<style>
.key{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2.5px;fill:#A9A7A5}
.value{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#F1EDE5}
.index{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#D6B987;letter-spacing:1px}
</style>
</defs>
<rect x="1" y="1" width="1198" height="124" rx="12" fill="url(#bg)" stroke="#AFA38E" stroke-opacity=".29"/>
<path d="M300 25V101M600 25V101M900 25V101" stroke="#B1AC9F" stroke-opacity=".25"/>
<g transform="translate(31 37)"><text class="index" x="0" y="0">01</text><text class="key" x="32" y="0">ENGINEERING</text><text class="value" x="0" y="44">Enterprise Storage</text></g>
<g transform="translate(330 37)"><text class="index" x="0" y="0">02</text><text class="key" x="32" y="0">ACADEMIC FOUNDATION</text><text class="value" x="0" y="44">Physics Engineering</text></g>
<g transform="translate(630 37)"><text class="index" x="0" y="0">03</text><text class="key" x="32" y="0">BUILDING WITH</text><text class="value" x="0" y="44">Python &amp; Linux</text></g>
<g transform="translate(930 37)"><text class="index" x="0" y="0">04</text><text class="key" x="32" y="0">EXPLORING</text><text class="value" x="0" y="44">Security &amp; AI</text></g>
</svg>