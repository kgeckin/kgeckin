<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Kardelen Geçkin | Engineering systems with purpose</title>
<desc id="desc">An editorial charcoal and champagne banner with a minimal layered infrastructure diagram, representing a progression from systems delivery to architecture.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0D12"/><stop offset=".58" stop-color="#11151C"/><stop offset="1" stop-color="#171820"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1"><stop stop-color="#A88B61"/><stop offset=".55" stop-color="#E8D2A9"/><stop offset="1" stop-color="#B99D6F"/></linearGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#D1C0A4" stroke-opacity=".028"/></pattern>
<style>
.meta{font:500 12px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#B4B0AC}
.name{font:750 94px 'Segoe UI',Arial,sans-serif;letter-spacing:2.8px;fill:#F4F1EA}
.sub{font:450 24px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#D4D1CA}
.cap{font:550 13px 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;fill:#CABDA6}
.node{font:550 17px 'Segoe UI',Arial,sans-serif;letter-spacing:.3px;fill:#E8E2D8}
.small{font:500 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#9E9C9A}
.path{stroke-dasharray:7 10;animation:flow 24s linear infinite}
@keyframes flow{to{stroke-dashoffset:-170}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="1440" height="520" rx="20" fill="url(#bg)"/>
<rect width="1440" height="520" rx="20" fill="url(#grid)"/>
<rect x="17" y="17" width="1406" height="486" rx="12" fill="none" stroke="#AFA38E" stroke-opacity=".29"/>
