<text x="113" y="236" class="name">KARDELEN</text>
<text x="113" y="333" class="name">GEÇKİN</text>
<path d="M115 355H250" stroke="url(#gold)" stroke-width="3"/>
<text x="113" y="394" class="sub">Engineering the foundations of what comes next.</text>
<path d="M823 123V398" stroke="#D5C8AF" stroke-opacity=".23"/>
<g>
<text x="895" y="139" class="cap">A SYSTEM IS MORE THAN ITS PARTS.</text>
