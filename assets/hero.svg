<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Kardelen Geçkin | Infrastructure, Cybersecurity, Applied AI</title>
<desc id="desc">Futuristic mission control banner featuring neon typography, animated signal rings, and technology nodes.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b17"/><stop offset=".53" stop-color="#0b1024"/><stop offset="1" stop-color="#150d2a"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#3ce6f3"/><stop offset=".5" stop-color="#8a74ff"/><stop offset="1" stop-color="#ed65c9"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset=".75" stop-color="#ddf8ff"/><stop offset="1" stop-color="#7feff7"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#46d9fa" stop-opacity=".16"/><stop offset=".72" stop-color="#8165ff" stop-opacity=".055"/><stop offset="1" stop-color="#8165ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#87a5e8" stroke-opacity=".085" stroke-width="1"/></pattern>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect x="1" y="1" width="1438" height="558" rx="22"/></clipPath>
<style>
.meta{font: 500 17px 'Consolas','Courier New',monospace;letter-spacing:2.6px;fill:#8ea7c9}
.label{font:600 13px 'Consolas','Courier New',monospace;letter-spacing:1.8px;fill:#b9c8ee}
.name{font: 800 91px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:url(#name)}
.small{font: 500 20px 'Segoe UI',Arial,sans-serif;letter-spacing:2.1px;fill:#b9cce5}
.pill{font:600 15px 'Consolas','Courier New',monospace;letter-spacing:1.1px;fill:#bfeff8}
.radar{animation:spin 26s linear infinite;transform-origin:1140px 265px}
.radar2{animation:spin 33s linear infinite reverse;transform-origin:1140px 265px}
.beacon{animation:pulse 2.5s ease-in-out infinite}
.scan{animation:scan 7s ease-in-out infinite}
.type{animation:blink 1.15s step-end infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%,100%{opacity:.15}50%{opacity:.65}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1440" height="560" fill="url(#bg)"/>
<rect width="1440" height="560" fill="url(#grid)"/>
<circle cx="1140" cy="265" r="340" fill="url(#aura)"/>
<path d="M0 498H1440" stroke="url(#edge)" stroke-opacity=".35"/>
<path d="M50 0V560M1390 0V560" stroke="#81beec" stroke-opacity=".11"/>
<g fill="#a5f4ff" opacity=".46">
