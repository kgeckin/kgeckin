<text x="48" y="534" class="label" style="font-size:10px;letter-spacing:3px">SIGNAL / CURIOUS BY DESIGN</text>
<text x="1392" y="534" text-anchor="end" class="label" style="font-size:10px;letter-spacing:3px">ISTANBUL • EARTH // 01</text>
</g>
<rect x="1" y="1" width="1438" height="558" rx="22" fill="none" stroke="url(#edge)" stroke-opacity=".45" stroke-width="2"/>
